; Прошивка RP2040-Zero для підсвітки козирка: енкодер крутить яскравість
; COB-ниток через AO3400A. Схема й розпіновка — README.md поруч.
;
; Перша заливка: затиснути BOOT на Zero, вставити USB-C — зʼявиться диск RPI-RP2.
; Далі (з цієї теки) заливка й монітор порту:
;   ~/.platformio/penv/bin/pio run -t upload && ~/.platformio/penv/bin/pio device monitor
; Наступні заливки — без BOOT: ядро саме перезавантажує плату в завантажувач.

[platformio]
default_envs = zero

[env:zero]
; Ядро Earle Philhower (arduino-pico) живе у форку платформи — офіційна
; raspberrypi у PlatformIO його не має. Закріплено комітом заради відтворюваності.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = waveshare_rp2040_zero
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
