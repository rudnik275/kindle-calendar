; Прошивка Arduino Nano для підсвітки козирка: енкодер крутить яскравість
; COB-ниток через AO3401. Схема — Obsidian, справочники/3d-печать/kindle tv dashboard.md.
;
; Залити й одразу відкрити монітор порту (з цієї теки):
;   ~/.platformio/penv/bin/pio run -t upload && ~/.platformio/penv/bin/pio device monitor
;
; Клони Nano здебільшого зі старим бутлоадером (57600 бод) → env nano.
; Якщо заливка падає з «not in sync» — бутлоадер новий: `-e nano_new`.

[platformio]
default_envs = nano

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
lib_deps = paulstoffregen/Encoder@^1.4.4

[env:nano_new]
extends = env:nano
board = nanoatmega328new
