<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Kindle Dashboard — dark fantasy (референс 2026-08-26)</title>
<!--
  Шаблон 800x600 за референсом «пергамент + вежа + портрет».
  Рендер: ./render.sh -> ./push-to-kindle.sh.

  АРТ-ШАРИ (за наявності файлів підхоплюються автоматично, інакше — чиста
  пергаментна текстура):
    art/bg.png        — full-bleed 800x600 grayscale ink-wash фон БЕЗ тексту
                        (вежа зліва, портрет справа, центр світлий під текст)
  Гігантське число на вежі — це ПОТОЧНА ТЕМПЕРАТУРА (рендериться поверх арту,
  не запікати в картинку!). Поки погода мок — 21.

  ДАНІ: події — local-data.js (window.DASH_DATA.events, як раніше).
  Годинник/дата/тиждень — JS на момент рендера.
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:800px; height:600px; overflow:hidden; background:#e6e4df; color:#141210; }
body { font-family:'PT Serif',serif; position:relative; }

/* ── фонові шари ── */
.bg-art { position:absolute; inset:0; width:800px; height:600px; object-fit:cover; }
.grain { position:absolute; inset:0; opacity:.5; mix-blend-mode:multiply; pointer-events:none; }
.vign { position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse 105% 95% at 50% 46%, rgba(0,0,0,0) 62%, rgba(20,18,16,.18) 100%); }

/* ── гігантська температура на вежі ── */
.temp { position:absolute; left:30px; top:180px; width:280px; text-align:center;
  font-family:'Cormorant Garamond',serif; font-weight:600; font-size:190px; line-height:1;
  color:#1c1a17; }
.temp.on-art { color:#ddd8d0; }   /* коли зʼявиться темна вежа під числом */

/* ── годинник ── */
.clockblk { position:absolute; left:390px; top:34px; width:330px; text-align:center; }
.clock { font-family:'Cormorant Garamond',serif; font-weight:500; font-size:88px; line-height:.95;
  letter-spacing:.02em; }
.dateline { font-family:'PT Serif',serif; font-size:19px; margin-top:6px; }
.ornrule { display:flex; align-items:center; gap:8px; margin-top:12px; }
.ornrule::before, .ornrule::after { content:''; flex:1; border-top:1px solid #2a2724; }

/* ── події ── */
.events { position:absolute; left:340px; top:200px; width:420px; }
.evr { display:flex; align-items:center; padding:10px 0; }
.evr + .evr { border-top:1px solid #55504a; }
.evr .when { width:118px; flex:none; }
.evr .wd { font-size:13px; letter-spacing:.22em; }
.evr .big { font-family:'Cormorant Garamond',serif; font-weight:600; font-size:40px; line-height:1;
  margin-top:-2px; font-variant-numeric:tabular-nums; }
.evr .big .sm { font-size:19px; letter-spacing:.03em; }
.evr .orn { flex:none; padding:0 14px 0 2px; }
.evr .what .name { font-size:17.5px; font-weight:700; }
.evr .what .sub { font-size:12.5px; color:#3c3833; margin-top:1px; }
.evr.muted .what .name { font-weight:400; font-style:italic; color:#4a453f; font-size:15px; }

/* ── тижнева смужка ── */
.week { position:absolute; left:0; right:0; bottom:26px; display:flex; padding:0 34px; }
.day { flex:1; text-align:center; position:relative; }
.day .a { font-size:13px; letter-spacing:.24em; }
.day .n { font-family:'Cormorant Garamond',serif; font-weight:600; font-size:44px; line-height:1.05; }
.day.today .inkbox { position:absolute; left:50%; top:-13px; transform:translateX(-50%);
  width:74px; height:86px; background:#181512; filter:url(#rough); z-index:0; }
.day.today .a, .day.today .n { position:relative; z-index:1; color:#e6e4df; }
.day.today .orn { position:absolute; left:50%; transform:translateX(-50%); bottom:-14px; z-index:1; }
</style>
</head>
<body>

<img class="bg-art" src="art/bg.png" onerror="this.remove()">
<svg class="grain" width="800" height="600">
  <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/>
    <feColorMatrix type="matrix" values="0 0 0 0 .45  0 0 0 0 .44  0 0 0 0 .42  0 0 0 .35 0"/></filter>
  <filter id="wash"><feTurbulence type="fractalNoise" baseFrequency=".012 .017" numOctaves="3" seed="11"/>
    <feColorMatrix type="matrix" values="0 0 0 0 .3  0 0 0 0 .29  0 0 0 0 .27  0 0 0 .22 0"/></filter>
  <rect width="800" height="600" filter="url(#wash)"/>
  <rect width="800" height="600" filter="url(#paper)"/>
</svg>
<div class="vign"></div>
<svg width="0" height="0"><filter id="rough">
  <feTurbulence type="fractalNoise" baseFrequency=".055" numOctaves="3" seed="4"/>
  <feDisplacementMap in="SourceGraphic" scale="9"/></filter></svg>

<div class="temp" id="temp">21</div>

<div class="clockblk">
  <div class="clock" id="clock">--:--</div>
  <div class="dateline" id="dateline">…</div>
  <div class="ornrule"><svg width="11" height="11" viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" fill="none" stroke="#2a2724" stroke-width="1.2" transform="rotate(45 6 6)"/></svg></div>
</div>

<div class="events" id="events"></div>

<div class="week" id="week"></div>

<script src="local-data.js"></script>
<script>
(function () {
  const DAYS_CAP = ['Неділя','Понеділок','Вівторок','Середа','Четвер','Пʼятниця','Субота'];
  const ABBR = ['ПН','ВТ','СР','ЧТ','ПТ','СБ','НД'];   // від понеділка
  const ABBR_SUN = ['НД','ПН','ВТ','СР','ЧТ','ПТ','СБ'];
  const MONTHS_GEN = ['січня','лютого','березня','квітня','травня','червня',
                      'липня','серпня','вересня','жовтня','листопада','грудня'];
  const MONTHS_AB = ['СІЧ','ЛЮТ','БЕР','КВІ','ТРА','ЧЕР','ЛИП','СЕР','ВЕР','ЖОВ','ЛИС','ГРУ'];
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const DIA = '<svg width="13" height="13" viewBox="0 0 12 12"><rect x="3" y="3" width="6" height="6" fill="none" stroke="#2a2724" stroke-width="1.1" transform="rotate(45 6 6)"/></svg>';

  document.getElementById('clock').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
  document.getElementById('dateline').textContent =
    DAYS_CAP[now.getDay()] + ', ' + now.getDate() + ' ' + MONTHS_GEN[now.getMonth()];

  // події (макс 4 рядки, як у референсі)
  const evs = ((window.DASH_DATA && window.DASH_DATA.events) || []).slice(0, 4);
  const todayStr = now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate());
  let html = '';
  if (!evs.some(e => e.start.slice(0,10) === todayStr)) {
    html += '<div class="evr muted"><span class="when"><span class="wd">' + ABBR_SUN[now.getDay()] + '</span>' +
      '<div class="big">' + now.getDate() + '</div></span><span class="orn">' + DIA + '</span>' +
      '<span class="what"><div class="name">сьогодні подій немає</div></span></div>';
  }
  for (const e of evs) {
    const d = new Date(e.start.slice(0,10) + 'T00:00');
    const big = e.allDay
      ? d.getDate() + ' <span class="sm">' + MONTHS_AB[d.getMonth()] + '</span>'
      : e.start.slice(11,16);
    html += '<div class="evr"><span class="when"><span class="wd">' + ABBR_SUN[d.getDay()] + '</span>' +
      '<div class="big">' + big + '</div></span><span class="orn">' + DIA + '</span>' +
      '<span class="what"><div class="name">' + esc(e.title) + '</div>' +
      (e.sub ? '<div class="sub">' + esc(e.sub) + '</div>' : '') + '</span></div>';
  }
  document.getElementById('events').innerHTML = html;

  // тижнева смужка пн–нд
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7));
  let wk = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
    const isToday = d.getDate() === now.getDate() && d.getMonth() === now.getMonth();
    wk += '<div class="day' + (isToday ? ' today' : '') + '">' +
      (isToday ? '<span class="inkbox"></span>' : '') +
      '<span class="a">' + ABBR[i] + '</span><div class="n">' + d.getDate() + '</div>' +
      (isToday ? '<span class="orn">' + DIA.replace('stroke="#2a2724"','stroke="#181512" fill="#181512"') + '</span>' : '') +
      '</div>';
  }
  document.getElementById('week').innerHTML = wk;
})();
</script>

</body>
</html>
