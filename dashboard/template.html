<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Kindle Dashboard — веб-інтерфейс (фінал, обраний 2026-08-26)</title>
<!--
  Шаблон екрана 800x600 (landscape). Рендер: ./render.sh (headless Chrome ->
  поворот у портрет 600x800 -> grayscale) -> ./push-to-kindle.sh.

  ДАНІ: події читаються з local-data.js (window.DASH_DATA, файл генерується і
  в git не йде). Дата, лінія часу, тижнева смужка — рахуються JS при рендері.
  Погода — поки мок (фаза даних на NAS: Open-Meteo).

  Контракт local-data.js:
    window.DASH_DATA = {
      today: [{time:"10:00"|null, title:"...", sub:"..."|undefined}],  // null = весь день
      days:  [{label:"Чт", num:27, events:[{time,title}]}, ...]        // наступні 5 днів
    };
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;800&family=JetBrains+Mono:wght@400;600&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:800px; height:600px; overflow:hidden; background:#fff; color:#111; }
body { font-family:'Onest',sans-serif; padding:22px 24px; display:flex; flex-direction:column; gap:12px; }

/* ── хедер ── */
.hdr h1 { font-size:27px; font-weight:800; letter-spacing:-.01em; }

/* ── сітка ── */
.main { flex:1; display:flex; gap:12px; min-height:0; }
.col-l { flex:1; display:flex; flex-direction:column; gap:12px; min-width:0; }
.col-r { width:252px; flex:none; display:flex; flex-direction:column; gap:12px; }

/* Калібрування на панелі 2026-08-26: лінії лише чорні (сірі hairline'и
   e-ink рве), кути прямі (AA-скруглення бруднить), заливки/спарклайни ок. */
.card { border:1px solid #000; border-radius:0; padding:13px 16px 14px; background:#fff; min-height:0; }
.card h2 { font-size:12.5px; font-weight:600; color:#555; margin-bottom:9px; }

/* агенда сьогодні */
.agenda { flex:1.15; display:flex; flex-direction:column; }
.now { display:flex; align-items:center; margin:4px 0; }
.now .dot { width:7px; height:7px; border-radius:50%; background:#000; flex:none; }
.now .line { flex:1; border-top:2px solid #000; }
.now .t { font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:600; padding-left:7px; }
.ev { display:flex; align-items:baseline; padding:7.5px 0; }
.ev .t { font-family:'JetBrains Mono',monospace; font-size:13.5px; font-weight:600; width:74px; flex:none; }
.ev .n { font-size:16.5px; font-weight:500; }
.ev .sub { font-size:12.5px; color:#777; margin-left:8px; }
.empty { color:#999; font-size:14px; padding:8px 0; }

/* найближчі дні */
.next { flex:1; }
.nd { display:flex; padding:5.5px 0; align-items:baseline; }
.nd + .nd { border-top:1px solid #000; }
.nd .d { width:60px; flex:none; font-size:13px; font-weight:600; }
.nd .d span { color:#888; font-weight:500; font-size:11.5px; }
.nd .evs { font-size:13.5px; line-height:1.45; color:#111; }
.nd .evs .tm { font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:600; color:#444; }
.nd .evs .free { color:#999; }

/* погода */
.wx-card { flex:1; }
.wx-now { display:flex; align-items:center; gap:12px; margin-bottom:7px; }
.wx-now .deg { font-size:38px; font-weight:800; letter-spacing:-.02em; line-height:1; }
.wx-now .cond { font-size:13px; color:#555; line-height:1.3; }
.wxr { display:flex; align-items:center; padding:4.5px 0; }
.wxr .d { width:52px; font-size:12px; font-weight:600; color:#444; }
.wxr .i { width:26px; }
.wxr svg { width:16px; height:16px; display:block; }
.wxr .hi { margin-left:auto; font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; }
.wxr .lo { width:34px; text-align:right; font-size:13px; color:#888; font-variant-numeric:tabular-nums; }

/* тижнева смужка */
.wk { display:flex; justify-content:space-between; }
.wk .c { text-align:center; width:30px; padding:3px 0 4px; }
.wk .a { display:block; font-size:9.5px; font-weight:500; color:#999; text-transform:uppercase; letter-spacing:.04em; }
.wk .n { display:block; font-size:15px; font-weight:600; margin-top:2px; }
.wk .c.today { background:#000; }
.wk .c.today .a { color:#bbb; }
.wk .c.today .n { color:#fff; font-weight:800; }
</style>
</head>
<body>

<div class="hdr">
  <h1 id="hdr-date">…</h1>
</div>

<div class="main">
  <div class="col-l">
    <div class="card agenda">
      <h2>Сьогодні</h2>
      <div id="today-list"></div>
    </div>

    <div class="card next">
      <h2>Найближчі дні</h2>
      <div id="next-days"></div>
    </div>
  </div>

  <div class="col-r">
    <!-- MOCK: погода — замінити рендером з Open-Meteo (фаза NAS) -->
    <div class="card wx-card">
      <h2>Погода</h2>
      <div class="wx-now">
        <span class="deg">21°</span>
        <span class="cond">ясно<br>вітер 4 м/с</span>
      </div>
      <div class="wxr"><span class="d">Чт 27</span><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg></span><span class="hi">22°</span><span class="lo">14°</span></div>
      <div class="wxr"><span class="d">Пт 28</span><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8"><path d="M6 18a4.5 4.5 0 1 1 .8-8.9 5.5 5.5 0 0 1 10.6 1.5A3.7 3.7 0 0 1 17 18Z"/></svg></span><span class="hi">20°</span><span class="lo">13°</span></div>
      <div class="wxr"><span class="d">Сб 29</span><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8"><path d="M6 15a4.5 4.5 0 1 1 .8-8.9 5.5 5.5 0 0 1 10.6 1.5A3.7 3.7 0 0 1 17 15Z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/></svg></span><span class="hi">18°</span><span class="lo">12°</span></div>
      <div class="wxr"><span class="d">Нд 30</span><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8"><circle cx="9" cy="10" r="3.4"/><path d="M9 3v2M3 10h2M4.8 5.8l1.4 1.4"/><path d="M11 19a4 4 0 1 1 .7-7.9 4.9 4.9 0 0 1 9.4 1.3A3.3 3.3 0 0 1 20 19Z"/></svg></span><span class="hi">19°</span><span class="lo">12°</span></div>
      <div class="wxr"><span class="d">Пн 31</span><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg></span><span class="hi">21°</span><span class="lo">13°</span></div>
    </div>

    <!-- ЖИВЕ: смужка поточного тижня, генерується JS -->
    <div class="card">
      <h2 id="wk-title">Тиждень</h2>
      <div class="wk" id="wk-row"></div>
    </div>
  </div>
</div>

<script src="local-data.js"></script>
<script>
// ЖИВІ елементи: рахуються на момент рендера headless Chrome.
(function () {
  const DAYS = ['Неділя','Понеділок','Вівторок','Середа','Четвер','Пʼятниця','Субота'];
  const ABBR = ['пн','вт','ср','чт','пт','сб','нд'];
  const MONTHS_GEN = ['січня','лютого','березня','квітня','травня','червня',
                      'липня','серпня','вересня','жовтня','листопада','грудня'];
  const MONTHS_NOM = ['Січень','Лютий','Березень','Квітень','Травень','Червень',
                      'Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
  const now = new Date();
  const hhmm = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

  document.getElementById('hdr-date').textContent =
    DAYS[now.getDay()] + ', ' + now.getDate() + ' ' + MONTHS_GEN[now.getMonth()];

  const data = window.DASH_DATA || null;

  // сьогодні: події + лінія поточного часу на своєму місці в хронології
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const nowLine = '<div class="now"><span class="dot"></span><span class="line"></span><span class="t">' + hhmm + '</span></div>';
  const evRow = e => '<div class="ev"><span class="t">' + (e.time || 'весь день') + '</span>' +
    '<span class="n">' + esc(e.title) + '</span>' +
    (e.sub ? '<span class="sub">' + esc(e.sub) + '</span>' : '') + '</div>';
  let html = '', placed = false;
  if (data && data.today.length) {
    for (const e of data.today) {
      const m = e.time ? parseInt(e.time,10)*60 + parseInt(e.time.slice(-2),10) : -1;
      if (!placed && m > nowMin) { html += nowLine; placed = true; }
      html += evRow(e);
    }
    if (!placed) html += nowLine;
  } else {
    html = nowLine + '<div class="empty">' + (data ? 'подій немає' : 'немає даних календаря') + '</div>';
  }
  document.getElementById('today-list').innerHTML = html;

  // найближчі дні
  const days = (data && data.days) || [];
  document.getElementById('next-days').innerHTML = days.map(d =>
    '<div class="nd"><span class="d">' + d.label + ' <span>' + d.num + '</span></span><span class="evs">' +
    (d.events.length
      ? d.events.map(e => (e.time ? '<span class="tm">' + e.time + '</span> ' : '') + esc(e.title)).join('&ensp;·&ensp;')
      : '<span class="free">вільний день</span>') +
    '</span></div>').join('');

  // смужка поточного тижня (пн–нд)
  document.getElementById('wk-title').textContent = MONTHS_NOM[now.getMonth()];
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7));
  let wk = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
    const isToday = d.getDate() === now.getDate() && d.getMonth() === now.getMonth();
    wk += '<span class="c' + (isToday ? ' today' : '') + '"><span class="a">' + ABBR[i] + '</span><span class="n">' + d.getDate() + '</span></span>';
  }
  document.getElementById('wk-row').innerHTML = wk;
})();
</script>

</body>
</html>
