# Живий конвеєр Kindle-дашборда на Synology.
# Розгортання й оновлення: dashboard/nas/install-nas.sh (запускати з мака).
#
# Переживання ребуту NAS тримається на чотирьох речах:
#   1) restart: always — демон Docker піднімає контейнер, щойно стартує сам
#      (пакет Container Manager вантажиться при завантаженні DSM);
#   2) весь стан — на /volume1 через бінд-маунт ./app (події, погода, лог,
#      мітки часу, known_hosts). Перестворення контейнера нічого не втрачає;
#   3) в образі вже все є — на старті не потрібні ні інтернет, ні реєстр:
#      NAS піднімається швидше за роутер, і це нормально;
#   4) внутрішній watchdog у live-push.sh виходить із кодом 1 на серії збоїв,
#      а restart: always піднімає його з чистим Chrome.
services:
  kindle-dash:
    build: .
    image: kindle-dash:local
    container_name: kindle-dash
    restart: always
    environment:
      TZ: Europe/Kyiv
      # KINDLE_HOST: 192.168.0.150   # розкоментуй, якщо книга переїхала
    volumes:
      - ./app:/app
    tmpfs:
      # кадри й тимчасовий профіль Chrome — у RAM: диски NAS не крутимо
      # щохвилини заради PNG, який живе 60 секунд
      - /tmp:size=192m
      - /app/out:size=32m
    # NAS має ~1.7 ГБ RAM на всіх (Jellyfin, Plex, боти). Ліміт не стільки
    # рятує нас, скільки сусідів: якщо Chrome піде рознос, OOM-killer убʼє
    # цей контейнер (і restart: always його підніме), а не Plex.
    mem_limit: 640m
    # memswap_limit == mem_limit — це докерівський спосіб сказати «свопу нема
    # взагалі» (загальна межа RAM+swap дорівнює межі RAM, отже на своп лишається
    # нуль). 2026-08-30 екран завмер на 1.5 години саме через своп: планові скани
    # медіатек (Plex — кожні ~64 хв, Jellyfin — свій) видавлювали Chrome туди, і
    # той починав вичитувати власні сторінки назад із диска, забитого тими ж
    # сканами — 40+ МБ/с підкачки, load 18 при простоюючому CPU. Рендер ріс із
    # секунд до 4-6.5 хвилин при такті циклу в одну хвилину.
    #
    # Ціна: якщо Chrome колись справді не влізе у 640 МБ (пік — 385 МБ, запас
    # 40%), його вбʼє OOM-killer замість тихого свопу. Це навмисний розмін:
    # рестарт за секунди кращий за годину з мертвим годинником на екрані.
    #
    # ⚠️ Не міняти на `mem_swappiness: 0` — виглядає точнішим, але docker compose
    # на цьому NAS (v2.20.1) цю опцію МОВЧКИ викидає: у `docker compose config`
    # її вже нема, і контейнер стартує зі свопом. Перевірено 2026-08-30.
    memswap_limit: 640m
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # watchtower на цьому NAS оновлює лише позначені контейнери
      # (WATCHTOWER_LABEL_ENABLE=true), але образ локальний — фіксуємо явно
      com.centurylinklabs.watchtower.enable: "false"
