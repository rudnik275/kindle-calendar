<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Kindle-дашборд — live-превью шаблона</title>
<!-- Показує актуальний template.html так, як він піде на панель.
     Відкрити: open preview.html -->
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#d8d8d3; font-family:-apple-system,'Helvetica Neue',sans-serif;
  min-height:100vh; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:16px; padding:40px 0; }
h1 { font-size:16px; font-weight:700; color:#222; }
.device { background:#3a3a3c; border-radius:14px; padding:30px; box-shadow:0 12px 40px rgba(0,0,0,.25); }
iframe { width:800px; height:600px; border:0; display:block; background:#fff;
  filter:grayscale(1) contrast(.96) brightness(.97); }
.note { font-size:12px; color:#777; max-width:560px; text-align:center; line-height:1.6; }
</style>
</head>
<body>
<h1>Kindle-дашборд · актуальний template.html</h1>
<div class="device"><iframe src="template.html" scrolling="no"></iframe></div>
<div class="note">Фільтр імітує матовий екран. Дата, «оновлено», лінія часу і місяць — живі
(рахуються на момент відкриття); події, погода, GSC — мок до фази даних на NAS.
E-ink токени за калібруванням на панелі: чорні 1px рамки, прямі кути, без світло-сірих hairline'ів.</div>
</body>
</html>
